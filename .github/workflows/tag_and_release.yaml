---
# Bump `[project] version` in a PR; merging it to main builds, signs, tags,
# creates a draft GitHub release, publishes to PyPI (once PYPI_PUBLISH is set), then
# publishes the draft. Nothing here retries: if a step fails, fix it and
# release a new version.
name: Tag and Release

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - ".github/workflows/tag_and_release.yaml"
      - ".github/workflows/test.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # never cancel a release mid-flight
  group: release-${{ github.ref }}

jobs:
  version:
    name: Check for an untagged version
    runs-on: ubuntu-latest
    if: github.repository == 'jgstew/uv-audit-cooldown' && github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.getversion.outputs.version }}
      release_needed: ${{ steps.tagged.outputs.release_needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Read version from pyproject.toml
        id: getversion
        run: |
          version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-]?[0-9A-Za-z.]+)?$'; then
            echo "::error::unexpected version string in pyproject.toml: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether v<version> is already tagged
        id: tagged
        env:
          VERSION: ${{ steps.getversion.outputs.version }}
        run: |
          if git show-ref --tags --verify --quiet -- "refs/tags/v${VERSION}"; then
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test
    needs: version
    if: needs.version.outputs.release_needed == 'true'
    uses: ./.github/workflows/test.yaml # zizmor: ignore[self-repository]

  # no write permissions: build code never runs next to a credential
  build:
    name: Build
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: false

      - name: uv build
        run: uv build

      - name: Compute SHA-256 checksums
        working-directory: dist
        run: sha256sum ./*.whl ./*.tar.gz > SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # signs what build made: holds an OIDC token but runs no build code
  attest:
    name: Attest build provenance
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      # the release asset Scorecard and `sigstore verify` look for
      - name: Name the Sigstore bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir sigstore
          cp "$BUNDLE" "sigstore/uv_audit_cooldown-${VERSION}.sigstore.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sigstore
          path: sigstore/
          if-no-files-found: error

  release:
    name: Tag and Release
    needs: [version, build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sigstore
          path: sigstore/

      # fail before tagging if the bundle doesn't verify
      - name: Verify the attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for file in dist/*.whl dist/*.tar.gz; do
            gh attestation verify "$file" --repo "${GITHUB_REPOSITORY}" --bundle sigstore/*.sigstore.json
          done

      - name: Build release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notes_file="${RUNNER_TEMP}/release-notes.md"
          if ! gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" --method POST \
                -f "tag_name=v${VERSION}" -f "target_commitish=${GITHUB_SHA}" \
                --jq '.body' > "$notes_file"; then
            printf 'Release v%s\n' "${VERSION}" > "$notes_file"
          fi
          # shellcheck disable=SC2016
          printf '\n## SHA-256\n\nVerify with `sha256sum -c SHA256SUMS.txt`:\n\n```\n%s\n```\n' \
            "$(cat dist/SHA256SUMS.txt)" >> "$notes_file"
          # shellcheck disable=SC2016
          printf '\nVerify provenance with `gh attestation verify <file> --repo %s`.\n' \
            "${GITHUB_REPOSITORY}" >> "$notes_file"
          echo "NOTES_FILE=$notes_file" >> "$GITHUB_ENV"

      # a draft release does not create its tag, so tag first
      - name: Create the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" --method POST \
            -f "ref=refs/tags/v${VERSION}" -f "sha=${GITHUB_SHA}"

      # a draft, so every asset is attached before the release is published
      # (and, with immutable releases, locked); no checkout, so name the repo
      - name: Create the draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --verify-tag --draft \
            --title "v${VERSION}" --notes-file "${NOTES_FILE}" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt sigstore/*.sigstore.json

  # Inert until the PyPI trusted publisher exists (workflow tag_and_release.yaml,
  # environment pypi) and the repository variable PYPI_PUBLISH is `true`.
  publish:
    name: Publish to PyPI
    needs: release
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    # must match the PyPI trusted publisher's environment name
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # only the wheel and sdist go to PyPI
      - name: Drop the checksums file
        run: rm dist/SHA256SUMS.txt

      # the same files the GitHub release carries, plus PEP 740 attestations
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true

  # last: if PyPI fails, the release stays a draft
  finalize:
    name: Publish the GitHub release
    needs: [version, release, publish]
    # publish is skipped while PYPI_PUBLISH is unset
    if: >-
      !cancelled() && needs.release.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.publish.result)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release edit "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --draft=false
