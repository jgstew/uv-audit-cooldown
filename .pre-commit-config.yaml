---
# pre-commit run --all-files --hook-stage manual
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-ast
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: detect-private-key
      - id: debug-statements
      - id: check-vcs-permalinks
      - id: name-tests-test
        args: ["--pytest-test-first"]
        exclude: ^tests/conftest\.py$

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-push, manual]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730 # v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/crate-ci/typos
    rev: b859c0df7f391deba73030f79b957e62b4d81dc6 # varcon-core-v5.0.7
    hooks:
      - id: typos

  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # v2.4.3
    hooks:
      - id: codespell

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: e8b4e28241a9ae8296ba6e4a491b5da4eda73283 # 3.11.1
    hooks:
      - id: editorconfig-checker

  - repo: https://github.com/adrienverge/yamllint.git
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # v1.38.0
    hooks:
      - id: yamllint
        args: [-c=.yamllint.yaml]

  - repo: https://github.com/asottile/pyupgrade
    rev: f22ea0651f4355c655cc581f67813c991c74a312 # v3.22.0
    hooks:
      - id: pyupgrade
        args: [--py310-plus]
        stages: [pre-push, manual]

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: 3a6eb0fadf60b3cccfd80bad9dbb6fae7e47b316 # v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-use-type-annotations
      - id: python-no-eval
      - id: python-check-blanket-type-ignore

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 17e12779811926f000bdfa1795f9e3735dd71ac3 # 0.26
    hooks:
      - id: validate-pyproject
        stages: [manual]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0494aa7fa1314e98913a41227d8f0a515b2c1049 # 0.38.2
    hooks:
      - id: check-github-workflows
        stages: [manual]
      - id: check-github-actions
        stages: [manual]
      - id: check-dependabot
        stages: [manual]

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint
        stages: [pre-push, manual]

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # v1.31.1
    hooks:
      - id: zizmor
        stages: [pre-push, manual]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 02747c5f318750b3c3ccfc1d83dd787b35d6c078 # 0.13.3
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      # this repo's own hook, from this checkout
      - id: uv-audit-cooldown
        name: uv audit (cooldown-aware, this checkout)
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [manual]
        entry: uv run --frozen --no-dev uv-audit-cooldown
      - id: mypy
        name: mypy (uv run mypy)
        language: system
        pass_filenames: false
        files: ^src/
        entry: uv run --frozen mypy
      - id: uv-lock-check
        name: uv lock --check (uv.lock matches pyproject.toml)
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]
        entry: uv lock --check
      - id: uv-build-wheel
        name: uv build (wheel + sdist build)
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]
        entry: sh -c 'out="$(mktemp -d)"; trap "rm -rf \"$out\"" EXIT; uv build --out-dir "$out"'

  - repo: meta
    hooks:
      - id: check-useless-excludes
        stages: [manual]
      - id: check-hooks-apply
        stages: [manual]
